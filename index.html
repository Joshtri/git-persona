<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo/logo-dark.png" />
    <title>GitPersona</title>
    <!--
      Inline critical dark-mode styles to prevent the white-flash before the
      CSS bundle loads. This is especially important on Windows / WebView2.
    -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d0e11;
        color-scheme: dark;
      }
    </style>
    <script>
      // Apply the last-known theme before first paint so there is no dark→light
      // flash when the user's saved preference differs from the dark default.
      (() => {
        var t;
        try {
          t = localStorage.getItem("gitpersona-theme");
          if (t === "light") {
            document.documentElement.dataset.theme = "light";
            document.documentElement.style.background = "#f7f7fa";
          } else if (t === "system" && !window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.dataset.theme = "light";
            document.documentElement.style.background = "#f7f7fa";
          }
          // "dark" or absent → :root tokens already apply dark, nothing to do.
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
